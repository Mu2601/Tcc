<head>
    <meta charset="UTF-8">

<!-- Fontes Externas -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Estilos CSS -->
    <link href="css/style.css" type="text/css" rel="stylesheet">
    <link href="css/pesquisa.css" type="text/css" rel="stylesheet">

    <!-- Script Principal (Caminho corrigido para sua pasta 'java') -->
    <script src="java/script.js" defer></script>
</head>
<body> 
    
    <!-- Navegação Superior -->
    <nav>
        <ul class="ul">
            <li>
                <a href="index.html"> 
                    <img src="imagem/icones/1.png" alt="home" class="ic">
                </a>
            </li>
            <li>
                <a href="Recomendações.html"> 
                    <img src="imagem/icones/4.png" alt="Rec" class="ic">
                </a>
            </li>
            <li>
                <a href="login.html">
                    <img src="imagem/icones/2.png" alt="login" class="ic">
                </a>
            </li>
            <li>
                <a href="Bibliotecaria.html">
                    <img src="imagem/icones/3.png" alt="biblioteca" class="ic">
                </a>
            </li>
        </ul>
    </nav>

    <!-- Cabeçalho com Banner -->
   <main>
        <header class="header-principal">
            <img src="imagem/recomendações.png" class="titulo" alt="Leitura Ideal" style="width: 100%; max-width: 1000px; height: auto; display: block; margin: 20px auto;">
        </header>

        <section class="secao-rec">
            <h2>Explorar por Gênero Literário</h2>
            
            <div class="seletor-container">
                <label for="genero-select" style="color: #aaa; font-family: 'Varela Round', sans-serif; display: block; margin-bottom: 10px;">Selecione uma categoria:</label>
                
                <select id="genero-select" class="btn-select-vinho" onchange="buscarPorGenero(this.value)">
                    <option value="" disabled selected>Escolha um Gênero...</option>
                    <option value="Ficção">Ficção</option>
                    <option value="Romance">Romance</option>
                    <option value="Aventura">Aventura</option>
                    <option value="Terror">Terror</option>
                    <option value="Biografia">Biografia</option>
                    <option value="Didático">Didático</option>
                    <option value="Tragédia">Tragédia</option>
                    <option value="Suspense/Policial">Suspense/Policial</option>
                    <option value="Distopia">Distopia</option>
                    <option value="Infantojuvenil">Infantojuvenil</option>
                </select>
            </div>

            <div id="grid-genero" class="livros-grid">
                <p class="msg-ajuda">Escolha um gênero acima para exibir as recomendações da biblioteca.</p>
            </div>
        </section>
    </main>
</body>
</html>
